<nav class="navbar navbar-expand-lg navbar-custom">

      <span class="hamburger-linha"></span>
      <span class="hamburger-linha"></span>

    </button>

    <!-- Menu -->
     <div class="navbar-collapse menu-angular"

           id="menu">

        <ul class="navbar-nav ms-auto align-items-center gap-3">

          <li class="nav-item">
            <a class="nav-link" routerLink="/" (click)="fecharMenu()">

          <li class="nav-item">

            <button class="btn btn-outline-mandala">

              <i class="bi bi-heart-fill favorito-ativo"></i>

              <span class="mobile-label">

              <span *ngIf="cartCount > 0"
