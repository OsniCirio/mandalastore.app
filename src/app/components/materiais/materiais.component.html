

<section class="materiais-section">

  <div class="container">

    <div class="materiais-header text-center">

      <span class="materiais-subtitulo">
        Feito com significado
      </span>

      <h2>Da matéria-prima à mandala</h2>

      <p>
        Conheça alguns dos materiais que dão forma,
        textura e personalidade às nossas peças.
      </p>

    </div>

    <div class="row g-4 justify-content-center">

      <div *ngFor="let material of materiais"
           class="col-12 col-sm-6 col-lg-3">

        <article class="material-card">

          <div class="material-image">

            <img [src]="material.imagem"
                 [alt]="material.titulo">

          </div>

          <div class="material-body">

            <span class="material-tag">
              {{ material.subtitulo }}
            </span>

            <h3>
              {{ material.titulo }}
            </h3>

            <button type="button"
                    class="material-link"
                    (click)="abrirMaterial(material)">

              Conheça

              <i class="bi bi-arrow-right"></i>

            </button>

          </div>

        </article>

      </div>

    </div>

  </div>

</section>

<div *ngIf="materialSelecionado"
     class="material-modal"
     (click)="fecharMaterial()">

  <div class="material-modal-content"
       (click)="$event.stopPropagation()">

    <button type="button"
            class="material-modal-close"
            (click)="fecharMaterial()"
            aria-label="Fechar">

      <i class="bi bi-x-lg"></i>

    </button>

    <div class="material-modal-image">

      <img [src]="materialSelecionado.imagem"
           [alt]="materialSelecionado.titulo">

    </div>

    <span class="material-tag">
      {{ materialSelecionado.subtitulo }}
    </span>

    <h2>
      {{ materialSelecionado.titulo }}
    </h2>

    <p>
      {{ materialSelecionado.descricao }}
    </p>

  </div>

</div>
