<div class="container mt-5">

  <div class="row">

    <!-- FORM -->

    <div class="col-md-7">

      <div class="card-mandala p-4">

        <h2 class="mb-4">

          Finalizar Pedido

        </h2>

        <form [formGroup]="form">

          <div class="mb-3">

            <label>
              Nome
            </label>

            <input class="form-control"
                   formControlName="nomeCliente">

          </div>

          <div class="mb-3">

            <label>
              Telefone
            </label>

            <input class="form-control"
                   formControlName="telefone">

          </div>

          <div class="mb-3">

            <label>
              E-mail
            </label>

            <input class="form-control"
                   formControlName="email">

          </div>

          <div class="mb-3">

            <label>
              Endereço
            </label>

            <textarea rows="4"
                      class="form-control"
                      formControlName="endereco">
            </textarea>

          </div>

        </form>

      </div>

    </div>

    <!-- RESUMO -->

    <div class="col-md-5">

      <div class="card-mandala p-4">

        <h3 class="mb-4">

          Resumo

        </h3>

        <div *ngFor="let item of cartItems"
             class="d-flex
                 justify-content-between
                 mb-3">

          <div>

            {{ item.nome }}

            x{{ item.quantidade }}

          </div>

          <div>

            {{
              item.valor *
              item.quantidade
              | currency:'R$ '
            }}

          </div>

        </div>

        <hr>

        <h3>

          Total:
          {{ total | currency:'BRL' }}

        </h3>

        <button class="btn-mandala
                 w-100
                 mt-4"
                [disabled]="loading"
                (click)="finalizar()">

          <span *ngIf="!loading">

            Finalizar Pedido

          </span>

          <span *ngIf="loading">

            Processando...

          </span>

        </button>

      </div>

    </div>

  </div>

</div>
