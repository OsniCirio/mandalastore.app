<section class="checkout-page">

  <div class="container">

    <div class="checkout-header">
      <p class="section-small">Finalização</p>
      <h1 class="section-title">Checkout</h1>
    </div>

    <div class="row g-5">

      <div class="col-lg-8">

        <div class="checkout-card">

          <h3>Dados pessoais</h3>

          <div class="row g-3">
            <div class="col-md-6">
              <input class="form-control input-soft" placeholder="Nome completo">
            </div>

            <div class="col-md-6">
              <input class="form-control input-soft" placeholder="E-mail">
            </div>

            <div class="col-md-6">
              <input class="form-control input-soft" placeholder="Telefone / WhatsApp">
            </div>

            <div class="col-md-6">
              <input class="form-control input-soft" placeholder="CPF">
            </div>
          </div>

        </div>

        <div class="checkout-card">

          <h3>Endereço de entrega</h3>

          <div class="row g-3">
            <div class="col-md-4">
              <input class="form-control input-soft" placeholder="CEP">
            </div>

            <div class="col-md-8">
              <input class="form-control input-soft" placeholder="Rua">
            </div>

            <div class="col-md-4">
              <input class="form-control input-soft" placeholder="Número">
            </div>

            <div class="col-md-8">
              <input class="form-control input-soft" placeholder="Complemento">
            </div>

            <div class="col-md-6">
              <input class="form-control input-soft" placeholder="Cidade">
            </div>

            <div class="col-md-6">
              <input class="form-control input-soft" placeholder="Estado">
            </div>
          </div>

        </div>

        <div class="checkout-card">

          <h3>Forma de pagamento</h3>

          <div class="payment-options">

            <label class="payment-option">
              <input type="radio" name="payment" checked>
              <span>Pix</span>
            </label>

            <label class="payment-option">
              <input type="radio" name="payment">
              <span>Cartão de crédito</span>
            </label>

            <label class="payment-option">
              <input type="radio" name="payment">
              <span>Boleto</span>
            </label>

          </div>

        </div>

      </div>

      <div class="col-lg-4">

        <div class="summary-card">

          <h3>Resumo do pedido</h3>

          <div class="summary-product">
            <span>Mandala Aurora</span>
            <strong>R$ 289,00</strong>
          </div>

          <div class="summary-product">
            <span>Mandala Essence</span>
            <strong>R$ 349,00</strong>
          </div>

          <div class="summary-line">
            <span>Subtotal</span>
            <span>R$ 638,00</span>
          </div>

          <div class="summary-line">
            <span>Frete</span>
            <span>R$ 29,00</span>
          </div>

          <div class="summary-line total">
            <span>Total</span>
            <span>R$ 667,00</span>
          </div>

          <button class="checkout-btn">
            Confirmar Pedido
          </button>

        </div>

      </div>

    </div>

  </div>

</section>
