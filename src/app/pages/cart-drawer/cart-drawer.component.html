<div class="cart-overlay"
     *ngIf="opened"
     (click)="close()">

</div>

<div class="cart-drawer"
     [class.open]="opened">

  <div class="p-4">

    <div class="d-flex
                justify-content-between
                align-items-center
                mb-4">

      <h3>
        Carrinho
      </h3>

      <button class="btn-close"
              (click)="close()">
      </button>

    </div>

    <div *ngFor="let item of cartItems"
         class="mb-4">

      <div class="d-flex gap-3">

        <img [src]="apiUrl + item.imagemUrl"
             width="70"
             class="rounded">

        <div class="flex-grow-1">

          <h6>
            {{ item.nome }}
          </h6>

          <div>

            {{ item.valor
              | currency:'R$ '
            }}

          </div>

          <div class="d-flex gap-2 mt-2">

            <button class="btn btn-light"
                     (click)="Qtde(item.id,-1)">

              -

            </button>

            <span>

              {{ item.quantidade }}

            </span>

            <button class="btn btn-light"
                    (click)="Qtde(item.id,1)">

              +

            </button>

          </div>

        </div>

      </div>

    </div>

    <hr>

    <h4>

      Total:
      {{ total | currency:'BRL' }}

    </h4>

    <button [disabled]="!this.cartItems.length"
            class="btn-mandala w-100 mt-3"
            (click)="finaliza()">

      Finalizar compra

    </button>

  </div>

</div>
