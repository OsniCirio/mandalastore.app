<section class="product-page">

  <div class="container">

    <div class="col-lg-1 mb-3">
      <button type="button"
              class="btn btn-mandala"
              (click)="voltar()">

        <i class="bi bi-arrow-left"></i>
        Voltar
      </button>
    </div>
    <div class="row g-5 align-items-start">

      <!-- GALERIA -->
      @if(produtoDetalhe(); as produto) {
      <div class="col-lg-7">

        <div class="product-gallery">

          <img [src]="getImageUrl()"
               class="main-image">

        </div>

      </div>
      <!-- INFORMAÇÕES -->

      <div class="col-lg-5">
        <p class="product-category">
          {{ produto.categoria   }}
        </p>
        <h1 class="product-title">
          {{ produto.nome}}
        </h1>
        <p class="product-price">
          {{ produto.preco | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
        </p>
        <p class="product-description">
          {{ produto.descricao }}
        </p>
        <!-- TAMANHOS -->
        <div class="sizes">
          <p class="section-label">
            Tamanho  {{ produto.largura }} x {{ produto.altura }} cm
          </p>

        </div>

        <!-- BOTÕES -->
        <div class="product-actions">
          <button class="btn-mandala large-btn"
                  (click)="adicionarCarrinho(produto)"
                  aria-label="Adicionar ao carrinho">
            Comprar Agora
          </button>
          
          <button class="btn btn-mandala" (click)="adicionarFavorito(produto)"
                  aria-label="Adicionar aos favoritos">
            Favoritar
          </button>
        </div>
        <!-- INFO EXTRA -->
        <div class="product-info">
          <div class="info-item">
            <span>
              ✨ Produção artesanal
            </span>
          </div>
          <div class="info-item">
            <span>
              🌿 Materiais premium
            </span>
          </div>
          <div class="info-item">
            <span>
              🚚 Envio para todo Brasil
            </span>
          </div>
        </div>
      </div>
      }
    </div>
  </div>
</section>
